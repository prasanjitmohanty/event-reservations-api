version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes   
    networks:
      - app-network

  nest-app:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: nest-app
    ports:
      - "3000:3000"
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - app-network
    volumes:
      - ./nest-app:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge
